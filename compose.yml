services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    depends_on:
      - searxng
    volumes:
      # persona.mdをビルドなしで差し替え可能にするため config/ をボリュームマウント
      - ./config:/app/config:ro
      # メッセージ検索用SQLite DB(./data/messages.db)をコンテナ再構築後も永続化するためマウント
      - ./data:/app/data
      # Twitter/Blueskyアーカイブ検索用。ホスト側の参考資料ディレクトリを読み取り専用マウント
      # Docker環境では .env のパスをコンテナ内パスに合わせること:
      #   TWITTER_ARCHIVE_PATH=/reference/twitter/data
      #   BLUESKY_ARCHIVE_PATH=/reference/bluesky/repo.car
      - D:\lab2\reference\twitter-2026-07-22-9fe1e485cf6b9a8ed3b8107daf69ae9d5bd50c98fb1329257165bf350bc14886:/reference/twitter:ro
      - D:\lab2\reference\bluesky:/reference/bluesky:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    # Docker上で実行する場合、Ollama等ホスト上のローカルLLMへは
    # localhost ではなく host.docker.internal でアクセスする必要がある。
    # .env の LLM_BASE_URL を以下のように設定すること:
    #   LLM_BASE_URL=http://host.docker.internal:11434/v1
    # Web検索(SearXNG)へは同じcompose内のサービス名で到達する。.env に:
    #   SEARXNG_URL=http://searxng:8080

  # 一般Web検索用のセルフホスト メタ検索エンジン
  searxng:
    image: searxng/searxng
    restart: unless-stopped
    init: true
    volumes:
      # settings.yml(JSON出力有効・secret_key設定)をマウント。初回起動時に
      # uwsgi.ini 等を書き込むため rw にする
      - ./searxng:/etc/searxng:rw
    ports:
      # ホストからの動作確認用(curl等)。左がホスト側、右はコンテナ内の待受(8080固定)。
      # bot からの通信はサービス名 http://searxng:8080 で行うため、この公開自体は必須ではない
      - "8088:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
