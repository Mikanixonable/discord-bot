# SearXNG 設定（デフォルト設定を継承し、bot からのJSON API利用に必要な項目だけ上書き）
use_default_settings:
  engines:
    # 初期化に失敗する/使わないエンジンを除去（ログのエラーを抑制）。
    # wikidata: SPARQLがレート制限で403 / ahmia・torch: Tor必須で到達不可
    remove:
      - wikidata
      - ahmia
      - torch

server:
  # 必須。適当なランダム文字列に差し替えること（例: `openssl rand -hex 32`）
  secret_key: "ccd26c5ff415d01be10d243f6765364d67a9361d893ff2078e5969e5f05f4ea2"
  # bot からの自動アクセスを弾かないようレートリミッタ/ボット検出を無効化（プライベート運用前提）
  limiter: false
  image_proxy: false

search:
  # 既定はHTMLのみ。bot が使う JSON 出力を有効化する（これが無いと format=json が403）
  formats:
    - html
    - json
